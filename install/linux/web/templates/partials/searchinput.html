{{define "searchinput"}}
<form action="/search" method="get" class="mt-3">
    <div class="input-group" style="height: 55px;">
        <span class="input-group-text" style="height: 100%; font-size: 18px;">
            <i class="bi bi-search"></i>
        </span>
        <div class="position-relative flex-grow-1">
            <input id="searchInput" class="form-control" style="height: 100%; font-size: 18px;" type="search" autocomplete="off"
                placeholder="{{.translator.Translate "search_placeholder" .lang}}" aria-label="Search" name="q" value="{{.query}}">
            <div id="search-suggestions"
                class="position-absolute w-100 bg-white border border-secondary rounded-bottom shadow-lg"
                style="display: none; z-index: 1000;">
                <ul class="list-group list-group-flush" style="max-height: 200px; overflow-y: auto;">
                    <!-- 搜索建议将通过JavaScript动态添加 -->
                </ul>
            </div>
        </div>
        <input type="hidden" name="lang" value="{{.lang}}">
        <!-- 动态添加的did字段，用于传递当前目录ID -->
        <input type="hidden" id="searchDid" name="did" value="0">
        <button class="btn btn-primary" style="height: 100%; font-size: 18px;" type="submit">{{.translator.Translate
            "search_button" .lang}}</button>
    </div>
</form>

 <script>
        // 搜索历史功能
        document.addEventListener('DOMContentLoaded', function() {
            // 加载搜索历史
            loadSearchHistory();
            
            // 监听搜索表单提交
            const searchForm = document.querySelector('form[action="/search"]');
            if (searchForm) {
                searchForm.addEventListener('submit', function(e) {
                    // 在提交前更新当前目录ID
                    setCurrentDirectoryId();
                    
                    const searchInput = this.querySelector('input[name="q"]');
                    const query = searchInput.value.trim();
                    if (query) {
                        saveSearchHistory(query);
                    }
                });
            }
            
            // 清空搜索历史按钮
            const clearButton = document.getElementById('clear-history');
            if (clearButton) {
                clearButton.addEventListener('click', function() {
                    if (confirm('确定要清空搜索历史吗？')) {
                        localStorage.removeItem('searchHistory');
                        loadSearchHistory();
                    }
                });
            }
            
            // 搜索建议功能
            const searchInput = document.getElementById('searchInput');
            const suggestionsContainer = document.getElementById('search-suggestions');
            const suggestionsList = suggestionsContainer.querySelector('ul');
            
            if (searchInput && suggestionsContainer) {
                // 监听输入事件
                searchInput.addEventListener('input', function() {
                    const query = this.value.trim();
                    if (query.length > 1) {
                        showSuggestions(query);
                    } else {
                        hideSuggestions();
                    }
                });
                
                // 监听点击事件，防止下拉框关闭
                searchInput.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const query = this.value.trim();
                    if (query.length > 1) {
                        showSuggestions(query);
                    }
                });
                
                // 监听键盘事件
                searchInput.addEventListener('keydown', function(e) {
                    const activeItem = suggestionsList.querySelector('.active');
                    const items = suggestionsList.querySelectorAll('li');
                    
                    switch (e.key) {
                        case 'ArrowDown':
                            e.preventDefault();
                            if (activeItem) {
                                activeItem.classList.remove('active');
                                activeItem.style.backgroundColor = '';
                                activeItem.style.color = '';
                                const nextItem = activeItem.nextElementSibling || items[0];
                                nextItem.classList.add('active');
                                nextItem.style.backgroundColor = '#0d6efd';
                                nextItem.style.color = 'white';
                                nextItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            } else if (items.length > 0) {
                                items[0].classList.add('active');
                                items[0].style.backgroundColor = '#0d6efd';
                                items[0].style.color = 'white';
                            }
                            break;
                        case 'ArrowUp':
                            e.preventDefault();
                            if (activeItem) {
                                activeItem.classList.remove('active');
                                activeItem.style.backgroundColor = '';
                                activeItem.style.color = '';
                                const prevItem = activeItem.previousElementSibling || items[items.length - 1];
                                prevItem.classList.add('active');
                                prevItem.style.backgroundColor = '#0d6efd';
                                prevItem.style.color = 'white';
                                prevItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            } else if (items.length > 0) {
                                items[items.length - 1].classList.add('active');
                                items[items.length - 1].style.backgroundColor = '#0d6efd';
                                items[items.length - 1].style.color = 'white';
                            }
                            break;
                        case 'Enter':
                            if (activeItem) {
                                e.preventDefault();
                                this.value = activeItem.textContent.trim();
                                hideSuggestions();
                            }
                            break;
                        case 'Escape':
                            hideSuggestions();
                            break;
                    }
                });
            }
            
            // 点击其他地方关闭下拉框
            document.addEventListener('click', function(e) {
                if (!searchInput || !suggestionsContainer) return;
                if (!searchInput.contains(e.target) && !suggestionsContainer.contains(e.target)) {
                    hideSuggestions();
                }
            });
            
            // 显示搜索建议
            function showSuggestions(query) {
                if (!searchInput || !suggestionsContainer || !suggestionsList) return;
                
                // 从API获取搜索建议
                fetch(`/api/suggestions?q=${encodeURIComponent(query)}`)
                    .then(response => response.json())
                    .then(data => {
                        const suggestions = data.suggestions || [];
                        
                        // 清空现有建议
                        suggestionsList.innerHTML = '';
                        
                        if (suggestions.length > 0) {
                            // 添加建议项
                            suggestions.forEach(suggestion => {
                                const li = document.createElement('li');
                                li.className = 'list-group-item';
                                li.textContent = suggestion;
                                li.style.cursor = 'pointer';
                                li.style.padding = '0.75rem 1rem';
                                li.style.transition = 'all 0.2s ease';
                                
                                // 添加悬停效果
                                li.addEventListener('mouseenter', function() {
                                    this.classList.add('active');
                                    this.style.backgroundColor = '#0d6efd';
                                    this.style.color = 'white';
                                });
                                
                                li.addEventListener('mouseleave', function() {
                                    this.classList.remove('active');
                                    this.style.backgroundColor = '';
                                    this.style.color = '';
                                });
                                
                                // 添加点击事件
                                li.addEventListener('click', function() {
                                    searchInput.value = this.textContent.trim();
                                    hideSuggestions();
                                });
                                
                                suggestionsList.appendChild(li);
                            });
                            
                            // 显示下拉框
                            suggestionsContainer.style.display = 'block';
                        } else {
                            // 显示"无建议"提示
                            const li = document.createElement('li');
                            li.className = 'list-group-item text-center text-muted';
                            li.textContent = '无搜索建议';
                            suggestionsList.appendChild(li);
                            suggestionsContainer.style.display = 'block';
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching suggestions:', error);
                        // 显示错误提示
                        suggestionsList.innerHTML = '';
                        const li = document.createElement('li');
                        li.className = 'list-group-item text-center text-danger';
                        li.textContent = '获取搜索建议失败';
                        suggestionsList.appendChild(li);
                        suggestionsContainer.style.display = 'block';
                    });
            }
            
            // 隐藏搜索建议
            function hideSuggestions() {
                if (suggestionsContainer) {
                    // 清除所有活跃状态的样式
                    const activeItems = suggestionsList.querySelectorAll('.active');
                    activeItems.forEach(item => {
                        item.classList.remove('active');
                        item.style.backgroundColor = '';
                        item.style.color = '';
                    });
                    suggestionsContainer.style.display = 'none';
                }
            }
        });
        
        // 保存搜索历史
        function saveSearchHistory(query) {
            // 获取现有的搜索历史
            let history = JSON.parse(localStorage.getItem('searchHistory') || '[]');
            
            // 移除重复的查询
            history = history.filter(item => item !== query);
            
            // 添加新的查询到开头
            history.unshift(query);
            
            // 保存到本地存储
            localStorage.setItem('searchHistory', JSON.stringify(history));
            
            // 重新加载搜索历史
            loadSearchHistory();
        }
        
        // 加载搜索历史
        function loadSearchHistory() {
            const historyTags = document.getElementById('history-tags');
            if (!historyTags) return;
            
            // 获取搜索历史
            const history = JSON.parse(localStorage.getItem('searchHistory') || '[]');
            
            // 清空标签容器
            historyTags.innerHTML = '';
            
            if (history.length === 0) {
                // 显示空历史提示
                const emptyTag = document.createElement('span');
                emptyTag.className = 'badge bg-secondary';
                emptyTag.textContent = '暂无搜索历史';
                historyTags.appendChild(emptyTag);
            } else {
                // 显示搜索历史标签
                history.forEach((query, index) => {
                    const tagContainer = document.createElement('div');
                    tagContainer.className = 'position-relative';
                    
                    // 创建标签链接
                    const tagLink = document.createElement('a');
                    tagLink.href = `/search?q=${encodeURIComponent(query)}&lang={{.lang}}`;
                    tagLink.className = 'badge bg-primary';
                    tagLink.textContent = query;
                    tagLink.style.textDecoration = 'none';
                    tagLink.style.padding = '0.5rem 1rem';
                    tagLink.style.fontSize = '0.9rem';
                    tagLink.style.borderRadius = '20px';
                    tagLink.style.transition = 'all 0.2s ease';
                    
                    // 添加悬停效果
                    tagLink.addEventListener('mouseenter', function() {
                        this.style.backgroundColor = '#0d6efd';
                        this.style.transform = 'scale(1.05)';
                    });
                    
                    tagLink.addEventListener('mouseleave', function() {
                        this.style.backgroundColor = '';
                        this.style.transform = '';
                    });
                    
                    // 创建删除按钮
                    const deleteButton = document.createElement('button');
                    deleteButton.className = 'btn-close position-absolute top-0 end-0 translate-middle';
                    deleteButton.style.marginTop = '-0.25rem';
                    deleteButton.style.marginRight = '-0.25rem';
                    deleteButton.style.fontSize = '0.75rem';
                    deleteButton.style.borderRadius = '50%';
                    deleteButton.style.backgroundColor = 'rgba(220, 53, 69, 0.8)';
                    deleteButton.style.transition = 'all 0.2s ease';
                    
                    // 添加悬停效果
                    deleteButton.addEventListener('mouseenter', function() {
                        this.style.backgroundColor = 'rgba(220, 53, 69, 1)';
                        this.style.transform = 'scale(1.1)';
                    });
                    
                    deleteButton.addEventListener('mouseleave', function() {
                        this.style.backgroundColor = 'rgba(220, 53, 69, 0.8)';
                        this.style.transform = '';
                    });
                    
                    // 添加点击事件
                    deleteButton.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        removeSearchHistoryItem(index);
                    });
                    
                    tagContainer.appendChild(tagLink);
                    tagContainer.appendChild(deleteButton);
                    historyTags.appendChild(tagContainer);
                });
            }
        }
        
        // 移除单个搜索历史
        function removeSearchHistoryItem(index) {
            let history = JSON.parse(localStorage.getItem('searchHistory') || '[]');
            history.splice(index, 1);
            localStorage.setItem('searchHistory', JSON.stringify(history));
            loadSearchHistory();
        }
        
        // 设置当前目录ID到搜索表单
        function setCurrentDirectoryId() {
            // 获取搜索表单的did字段
            const didInput = document.getElementById('searchDid');
            if (!didInput) return;
            
            // 查找面包屑导航的最后一个li元素
            const breadcrumb = document.getElementById('breadcrumb');
            if (!breadcrumb) {
                // 如果没有面包屑导航，说明不在目录页面，将did设置为0
                didInput.value = '0';
                return;
            }
            
            const lastLi = breadcrumb.querySelector('li:last-child');
            if (!lastLi) {
                // 如果没有最后一个li元素，将did设置为0
                didInput.value = '0';
                return;
            }
            
            // 获取data-dir-id属性值
            const dirId = lastLi.getAttribute('data-dir-id');
            if (!dirId) {
                // 如果没有data-dir-id属性，将did设置为0
                didInput.value = '0';
                return;
            }
            
            // 设置到搜索表单的did字段
            didInput.value = dirId;
        }
    </script>
{{end}}
