<!DOCTYPE html>
<html lang="{{.lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}} - {{.translator.Translate "app_name" .lang}}</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/static/css/custom.css" rel="stylesheet">
</head>
<body>
    {{template "navbar" .}}

    <!-- Header with Search Box -->
    <header class="bg-light py-1">
        <div class="container">
            {{template "searchinput" .}}
        </div>
    </header>

    <!-- Main Content -->
    <div class="container mt-5">
        <h1>{{.translator.Translate "settings" .lang}}</h1>
        <div class="card">
            <div class="card-header bg-primary text-white">
                {{.translator.Translate "language" .lang}}
            </div>
            <div class="card-body">
                {{if .message}}
                <div class="alert alert-success" role="alert">
                    {{.message}}
                </div>
                {{end}}
                <form action="/settings" method="post">
                    <div class="mb-3">
                        <label for="defaultLanguage" class="form-label">{{.translator.Translate "language" .lang}}</label>
                        <select class="form-select" id="defaultLanguage" name="defaultLanguage">
                            {{range .languages}}
                            <option value="{{.}}" {{if eq . $.lang}}selected{{end}}>{{.}}</option>
                            {{end}}
                        </select>
                    </div>
                    <input type="hidden" name="lang" value="{{.lang}}">
                    <button type="submit" class="btn btn-primary">保存</button>
                </form>
            </div>
        </div>
        <div class="card mt-4">
            <div class="card-header bg-primary text-white">
                Logo设置
            </div>
            <div class="card-body">
                {{if .logoMessage}}
                <div class="alert alert-success" role="alert">
                    {{.logoMessage}}
                </div>
                {{end}}
                <div class="text-center mb-4">
                    <img src="/static/images/logo.png" alt="Current Logo" class="img-fluid" style="max-height: 150px;">
                </div>
                <form action="/api/upload/logo" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="logoFile" class="form-label">上传新Logo</label>
                        <input class="form-control" type="file" id="logoFile" name="logo" accept="image/*">
                        <div class="form-text mt-1">
                            支持的格式：JPG、PNG、GIF。建议尺寸：200x200像素。
                        </div>
                    </div>
                    <input type="hidden" name="lang" value="{{.lang}}">
                    <button type="submit" class="btn btn-primary">上传Logo</button>
                </form>
            </div>
        </div>
    </div>

    {{template "footer" .}}
</body>
</html>
