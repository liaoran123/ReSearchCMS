<!DOCTYPE html>
<html lang="{{.lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}} - {{.translator.Translate "app_name" .lang}}</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/static/css/custom.css" rel="stylesheet">
</head>
<body>
    {{template "navbar" .}}

    <!-- Header with Search Box -->
    <header class="bg-light py-1">
        <div class="container">
            {{template "searchinput" .}}
        </div>
    </header>

    <!-- Main Content -->
    <div class="container mt-5">
        <h1>创建文档索引</h1>
        <div class="card">
            <div class="card-header bg-primary text-white">
                索引设置
            </div>
            <div class="card-body">
                <form id="indexForm" action="/api/index/path" method="post">
                    <!-- 索引路径/文件输入 -->
                    <div class="mb-4">
                        <label for="indexPath" class="form-label">索引路径/文件</label>
                        <input type="text" class="form-control" id="indexPath" name="path" placeholder="输入要索引的文件路径或文件，例如：D:\Documents" value="{{.configPath}}">
                        <div class="form-text mt-1">
                            提示：请直接输入目录路径或文件路径。
                        </div>
                    </div>
                    
                    <!-- 密码输入 -->
                    <div class="mb-4">
                        <label for="indexPassword" class="form-label">密码</label>
                        <input type="password" class="form-control" id="indexPassword" name="password" placeholder="输入索引密码" value="123456">
                    </div>
                    
                    <!-- 保存为总目录选项 -->
                    <div class="mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="saveAsRoot" name="saveAsRoot" value="true">
                            <label class="form-check-label" for="saveAsRoot">
                                保存路径为总目录
                            </label>
                        </div>
                        <div class="form-text mt-1">
                            勾选后，此路径将被设置为总目录，目录浏览页面将以此路径为根目录。
                        </div>
                    </div>
                    
                    <!-- 语言隐藏字段 -->
                    <input type="hidden" name="lang" value="{{.lang}}">
                    
                    <!-- 提交按钮 -->
                    <button type="submit" class="btn btn-primary">创建索引</button>
                </form>
                
                <!-- 结果显示区域 -->
                <div id="index-result" class="mt-3"></div>
            </div>
        </div>
    </div>

    {{template "footer" .}}
    <script>
        // 确保DOM加载完成
        document.addEventListener('DOMContentLoaded', function() {
            // 获取表单和相关元素
            const form = document.getElementById('indexForm');
            const resultDiv = document.getElementById('index-result');
            const pathInput = document.getElementById('indexPath');
            const passwordInput = document.getElementById('indexPassword');
            const submitButton = document.querySelector('#indexForm button[type="submit"]');
            
            // 为表单添加提交事件监听器
            form.addEventListener('submit', function(e) {
                // 阻止默认提交行为
                e.preventDefault();
                e.stopPropagation();
                
                // 重置错误信息
                resultDiv.innerHTML = '';
                
                // 获取表单数据
                const path = pathInput.value.trim();
                const password = passwordInput.value.trim();
                const lang = form.querySelector('input[name="lang"]').value;
                
                // 验证参数
                if (!path) {
                    resultDiv.innerHTML = `<div class="alert alert-danger" role="alert">请输入索引路径</div>`;
                    pathInput.focus();
                    return;
                }
                
                if (!password) {
                    resultDiv.innerHTML = `<div class="alert alert-danger" role="alert">请输入密码</div>`;
                    passwordInput.focus();
                    return;
                }
                
                // 验证路径格式
                if (path.length < 3) {
                    resultDiv.innerHTML = `<div class="alert alert-danger" role="alert">索引路径格式无效</div>`;
                    pathInput.focus();
                    return;
                }
                
                // 验证密码长度
                if (password.length < 6) {
                    resultDiv.innerHTML = `<div class="alert alert-danger" role="alert">密码长度至少为6位</div>`;
                    passwordInput.focus();
                    return;
                }
                
                // 禁用提交按钮，防止重复提交
                submitButton.disabled = true;
                submitButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> 处理中...';
                
                // 显示加载状态
                resultDiv.innerHTML = `
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-2">正在创建索引，请稍候...</p>
                    <div class="alert alert-info mt-3">
                        <strong>提示：</strong>索引创建时间取决于文件大小和数量，可能需要几分钟或几十分钟，请耐心等待。
                    </div>
                `;
                
                // 获取保存为总目录选项
                const saveAsRoot = document.getElementById('saveAsRoot').checked;
                
                // 发送请求
                fetch('/api/index/path', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        path: path,
                        password: password,
                        saveAsRoot: saveAsRoot,
                        lang: lang
                    })
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('网络请求失败');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.error) {
                        resultDiv.innerHTML = `<div class="alert alert-danger" role="alert">索引失败: ${data.error}</div>`;
                    } else {
                        resultDiv.innerHTML = `<div class="alert alert-success" role="alert">索引成功: ${data.message}</div>`;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    resultDiv.innerHTML = `<div class="alert alert-danger" role="alert">错误: ${error.message}</div>`;
                })
                .finally(() => {
                    // 重新启用提交按钮
                    submitButton.disabled = false;
                    submitButton.innerHTML = '创建索引';
                });
            });
            
            // 为输入框添加实时验证
            pathInput.addEventListener('blur', function() {
                const path = this.value.trim();
                if (path && path.length < 3) {
                    resultDiv.innerHTML = `<div class="alert alert-danger" role="alert">索引路径格式无效</div>`;
                } else if (!path) {
                    resultDiv.innerHTML = '';
                }
            });
            
            passwordInput.addEventListener('blur', function() {
                const password = this.value.trim();
                if (password && password.length < 6) {
                    resultDiv.innerHTML = `<div class="alert alert-danger" role="alert">密码长度至少为6位</div>`;
                } else if (!password) {
                    resultDiv.innerHTML = '';
                }
            });
        });
    </script>
</body>
</html>
