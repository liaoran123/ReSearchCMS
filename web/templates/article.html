<!DOCTYPE html>
<html lang="{{.lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}} - {{.translator.Translate "app_name" .lang}}</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/static/css/custom.css" rel="stylesheet">
</head>
<body>
    {{template "navbar" .}}

    <!-- Header with Search Box -->
    <header class="bg-light py-1">
        <div class="container">         
           {{template "searchinput" .}}
        </div>
    </header>

    <!-- Main Content -->
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-primary text-white" id="article-header">
                {{.translator.Translate "article" .lang}} {{.articleId}}
            </div>
            <div class="card-body">
                <div id="article-content">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">{{.translator.Translate "loading" .lang}}</span>
                    </div>
                    <p class="mt-2">{{.translator.Translate "loading" .lang}}...</p>
                </div>
            </div>
        </div>
    </div>

    {{template "footer" .}}
    <script>
        // 加载文章内容
        document.addEventListener('DOMContentLoaded', function() {
            const articleId = "{{.articleId}}";
            const lang = "{{.lang}}";
            const contentContainer = document.getElementById('article-content');
            
            // 显示加载状态
            contentContainer.innerHTML = `
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">{{.translator.Translate "loading" .lang}}</span>
                </div>
                <p class="mt-2">{{.translator.Translate "loading" .lang}}...</p>
            `;
            
            // 从API获取文章内容
            fetch(`/api/article/${articleId}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    // 更新卡片头部显示文章标题
                    const headerContainer = document.getElementById('article-header');
                    headerContainer.innerHTML = data.title;
                    
                    // 渲染文章内容
                    contentContainer.innerHTML = `
                        <h1 class="mb-4">${data.title}</h1>
                        <div class="text-muted mb-4">
                            <small>{{.translator.Translate "file_path" .lang}}: ${data.url}</small>
                        </div>
                        <div class="mb-4" style="font-size: 16px; line-height: 1.8;">
                            ${data.content}
                        </div>
                    `;
                })
                .catch(error => {
                    console.error('Error loading article content:', error);
                    contentContainer.innerHTML = `
                        <div class="alert alert-danger" role="alert">
                            {{.translator.Translate "error_loading_article" .lang}}
                        </div>
                    `;
                });
        });
    </script>
</body>
</html>
