 {{define "footer"}}
<!-- Back to Top Button -->
<button id="back-to-top" class="btn btn-primary btn-floating rounded-circle" style="position: fixed; bottom: 30px; right: 30px; z-index: 99;">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-up" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M8 15a.5.5 0 0 0 .5-.5V2.707l3.146 3.147a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 1 0 .708.708L7.5 2.707V14.5a.5.5 0 0 0 .5.5z"/>
    </svg>
</button>

<!-- Footer -->
    <footer class="bg-light text-center text-lg-start mt-5">
        <div class="container p-4">
            <div class="text-center">
                <p>{{.translator.Translate "app_name" .lang}} &copy; 2026 | 
                    <a href="https://github.com/liaoran123/ReSearchCMS" target="_blank" class="text-decoration-none">
                        GitHub
                    </a> | 
                    使用 
                    <a href="https://github.com/liaoran123/sfsDb" target="_blank" class="text-decoration-none">
                        sfsDb
                    </a> 
                    作为数据库引擎
                </p>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5.3 JS -->
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="/static/js/custom.js"></script>
    <script>
        // 返回顶部按钮功能
        document.addEventListener('DOMContentLoaded', function() {
            const backToTopButton = document.getElementById('back-to-top');
            
            // 初始隐藏返回顶部按钮
            backToTopButton.style.display = 'none';
            
            // 监听滚动事件
            window.addEventListener('scroll', function() {
                if (window.pageYOffset > 300) {
                    backToTopButton.style.display = 'block';
                } else {
                    backToTopButton.style.display = 'none';
                }
            });
            
            // 点击返回顶部
            backToTopButton.addEventListener('click', function() {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        });
    </script>
    {{end}}
