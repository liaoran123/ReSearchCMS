<!DOCTYPE html>
<html lang="{{.lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}} - {{.translator.Translate "app_name" .lang}}</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/static/css/custom.css" rel="stylesheet">
</head>
<body>
    {{template "navbar" .}}



    <!-- Main Content -->
    <div class="container mt-5">
        <div class="jumbotron">
            <div class="text-center mb-4">
                <img src="/static/images/logo.png" alt="Search Engine Logo" class="img-fluid" style="max-height: 200px;">
            </div>
            <hr class="my-4">
             {{template "searchinput" .}}
        </div>

        <div class="mt-5">
            <h2>搜索历史</h2>
            <div id="search-history" class="mt-3">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        最近搜索
                    </div>
                    <div class="card-body">
                        <div id="history-tags" class="d-flex flex-wrap gap-2">
                            <span class="badge bg-secondary">暂无搜索历史</span>
                        </div>
                        <div class="mt-3">
                            <button id="clear-history" class="btn btn-danger">清空搜索历史</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {{template "footer" .}}
   
</body>
</html>
